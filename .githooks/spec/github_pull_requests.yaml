required_body_headings:
- Issue
- What
- Why
- Construction plan
- Delivery record
- How to test
- Checklist
required_title_headings:
- Goal
- Background
- Done when
- Suspected areas
- Out of scope
title_must_be_chinese: true
forbidden_brackets_in_title:
- （
- ）
- 「
- 」
- 【
- 】
- 『
- 』
- 《
- 》
- 〈
- 〉
allowed_branch_prefixes:
- feat/
- fix/
- chore/
- epic/
- main
- master
- release/
fixes_keywords:
- Fixes
- Closes
- Resolves
type_labels_cfg:
- bug
- enhancement
- feature
- documentation
- chore
- refactor
- tests
- epic
ci_check_mode: WARN
done_when_check_mode: FAIL
keyword_label_suggestions:
  bug: bug
  修复: bug
  新功能: enhancement
  功能: enhancement
  功能添加: enhancement
  清理: chore
  优化: refactor
  测试: tests
  代码质量: refactor
linkage_check:
  plain_text_links_severity: INFO
  fixes_epic_severity: WARN
severity_overrides:
  PR-03: FAIL
  PR-04: FAIL
  PR-05: WARN
  PR-06: WARN
  PR-07: FAIL
  PR-08: FAIL
