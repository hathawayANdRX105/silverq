enabled: true
naming_pattern: '(it|test)\\('
min_assertions_per_test: 1
assert_patterns: ['expect\\(', 'assert\\.']
required_helpers: ['afterEach', 'describe']
paths_include: ["**/*.test.js", "**/*.spec.js", "**/*.test.ts", "**/*.spec.ts"]
paths_exclude: ["node_modules/", "dist/", ".wt/"]

# 检查能力选择 / 严重度 (缺省 = 全部启用, WARN)
#   checks: [CL-01]   # 能力白名单: 只保留列出的检查项 (ID 或前缀)
#   fail_severity: WARN  # 本家族检查项严重度 (FAIL=硬拦 / WARN=提示 / INFO=参考)
