# cleanup_branch_cleanup.yaml — branch cleanup configuration
#
# gate Rust cleanup validator reads this file for all policy decisions.

protected_branches:
  - main
  - master
  - dev
  - "release/*"

local_merged:
  action: WARN    # WARN | DELETE

remote_merged:
  action: WARN

orphan_local:
  action: WARN

temp_branch:
  action: WARN

temp_branch_prefixes:
  - "tmp/"
  - "wip/"
  - "test/"

current_branch_protected: true

# 检查能力选择 / 严重度 (缺省 = 全部启用, WARN)
#   checks: [CL-01]   # 能力白名单: 只保留列出的检查项 (ID 或前缀)
#   fail_severity: WARN  # 本家族检查项严重度 (FAIL=硬拦 / WARN=提示 / INFO=参考)
