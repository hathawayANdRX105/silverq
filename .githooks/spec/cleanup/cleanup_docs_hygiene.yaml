file_extensions: [".md", ".txt", ".rst"]
ignore_paths:
  - ".wt/"
  - "node_modules/"
  - "target/"
forbidden_brackets:
  - "（"
  - "）"
  - "「"
  - "」"
  - "【"
  - "】"
  - "『"
  - "』"
  - "《"
  - "》"
  - "〈"
  - "〉"
check_fullwidth: true
cn_en_space_required: false
broken_link_check: true
stale_marker_keywords: ["TODO", "FIXME", "XXX"]
min_content_lines: 3

# 检查能力选择 / 严重度 (缺省 = 全部启用, WARN)
#   checks: [CL-01]   # 能力白名单: 只保留列出的检查项 (ID 或前缀)
#   fail_severity: WARN  # 本家族检查项严重度 (FAIL=硬拦 / WARN=提示 / INFO=参考)
