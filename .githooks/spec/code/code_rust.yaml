enabled: true
# 根目录无 manifest (如 harness 独立 crate) 时跳过, 防假 FAIL
# fmt 违规以 cargo fmt 的 "Diff in" 输出为准; metadata/workspace 报错是环境配置问题, 不算违规
command: sh
args:
  - "-c"
  - |
    ms=$(git ls-files | grep -E '(^|/)Cargo.toml$')
    [ -z "$ms" ] && exit 0
    rc=0
    for m in $ms; do
      d=$(dirname "$m")
      out=$(cd "$d" && cargo fmt --check 2>&1) || {
        case "$out" in
          *"Diff in"*) printf '%s\n' "$out"; rc=1 ;;
          *) : ;;
        esac
      }
    done
    exit $rc
fail_severity: FAIL
paths_include: ["**/*.rs"]
paths_exclude: ["target/", ".wt/"]
