# 语义层审查（Rust）：L2 语义 checklist，判决由 jev 驱动。
# 忠实移植 alibaba/open-code-review 的 internal/config/rules/rule_docs/rust.md
# 并扩展 canon 自有类目：15 类缺陷判定（noul）+ 总分（score）。
# name_behavior / comment_rubric / placement / clone_necessity /
# cleanliness_semantics 对着 tree-sitter 事实卡判决（state.facts: true）——
# 名字-行为一致、注释信息层、位置适配、整洁语义。
# instructions 移植自上游原文子规则 + canon 增补，非综合改写。
enabled: true
hooks: [merge]
sla: l2
fail_severity: WARN
mode: file
match:
  paths_include: ["**/*.rs"]
  paths_exclude: ["target/", ".wt/"]
harness:
  command: "python3"
  args:
    - ".githooks/spec/harness/jev_rule.py"
    - "--config"
    - ".githooks/spec/harness/semantic-rust.json"
  # 语义审查按变更文件喂，冷路径（merge）跑，不拖 pre-commit
optional: true
timeout: 300
