# CK-DIOXUS-SIGNAL-RULES: GlobalSignal 纪律（REFACTOR-RULES R11）
#
# 为什么: GlobalSignal 是全树可写的隐式依赖，每加一个都放大重渲染面；
#   现存两处（i18n::LOCALE、toast::TOASTS）里 LOCALE 带完整理由注释是范本。
#   「是否必须全局」jev 判不了（要架构上下文），但两条可机械查：
#   (1) 理由存在性：static 声明上方 8 行内无任何 // 注释即 FAIL（理由质量归
#       review；窗口 8 = LOCALE 范本 4 行 doc 的 2 倍余量，长 doc 注释不漏）；
#   (2) 使用形态：GlobalSignal 出现在非 static 声明处（fn 体内 new 全局信号、
#       局部引用）→ FAIL 人审——kymido workspace.rs 的
#       `GlobalSignal::<bool>::new` 即此形态（抽取验证 2026-10-01 抓到）。
# 升级 FAIL 依据（2026-10-01 三仓数据）：NOREASON 存量债=0（LOCALE/TOASTS
#   均带理由注释），USE 存量债=1（kymido workspace.rs fn 体内 new）——changed
#   口径只在触碰债行时咬人，存量零成本；新全局信号无理由/错形态从源头硬拦。
# 口径: 内联 sh；scope 同 list_key（$0：changed = diff 基线 GATE_BASE/origin/main，
#   repo 全仓）。热路径不共享 signal 的架构约束留在 web_spec.json state_ownership
#   问句与 REBUILD_CONTRACT 契约 4。两段扫描的输出在末尾合成**一个** JSON 数组
#   （引擎对非法 JSON 整条判 ERROR，禁止裸拼接两个数组）。
# 语言范围声明（2026-10-01 二轮审计）: 本规则锁定 Rust/Dioxus 语法（rsx/#[component]）。
# 无 .rs 的仓（React/TS/Svelte）自动安静——安静=未验证，≠ 干净；非 Dioxus 仓的前端门禁
# 需要语言适配器（R1 的 React 适配器见 checklist_react_list_key；Svelte/Solid 暂走语义层）。
enabled: true
hooks: [pre-push, merge]
sla: l1
fail_severity: FAIL
match:
  paths_include: ["**/*.rs"]
  paths_exclude: ["target/", ".wt/", "node_modules/"]
mode: grep
harness:
  command: "sh"
  args:
    - "-c"
    - |
      scope="${0:-changed}"
      root="$(git rev-parse --show-toplevel 2>/dev/null)" || { printf '[]'; exit 0; }
      cd "$root"
      list() {
        if [ "$scope" = "changed" ]; then
          git diff "${GATE_BASE:-origin/main}" --name-only -z -- '*.rs'
        else
          git ls-files -z -- '*.rs' | tr '\0' '\n' | grep -vE '(^|/)(tests|benches)/' | tr '\n' '\0'
        fi
      }
      # 1) static 声明缺理由注释（8 行窗口内无 // 注释）→ 单条数组
      a="$(list | xargs -0r grep -HnB8 -E 'static[[:space:]]+[A-Za-z_]+[[:space:]]*:[[:space:]]*GlobalSignal<' -- 2>/dev/null |
        awk '
          /^--$/ { hasc = 0; next }
          {
            if (!match($0, /^[^:]+[-:][0-9]+[-:]/)) next
            prefix = substr($0, 1, RLENGTH - 1)
            kind   = substr($0, RLENGTH, 1)
            rest   = substr($0, RLENGTH + 1)
            if (kind == "-") { if (index(rest, "//") > 0) hasc = 1; next }
            if (!hasc) print prefix
            hasc = 0
          }
        ' |
        jq -Rsc 'split("\n") | map(select(length > 0) | capture("^(?<path>.+):(?<line>[0-9]+)$")) |
                 map({id: "DIOXUS-GLOBALSIGNAL-NOREASON", severity: "FAIL",
                      path, line: (.line | tonumber),
                      message: "GlobalSignal 声明缺理由注释：仅限全站单例，照 i18n.rs LOCALE 的写法在声明处写明「为什么必须全局」（REFACTOR-RULES R11）"})'
      )"
      # 2) 非 static 声明处的 GlobalSignal 使用（注释行排除）→ 单条数组
      b="$(list | xargs -0r grep -HnE 'GlobalSignal(<|::)' -- 2>/dev/null |
        grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' |
        grep -vE '^[^:]+:[0-9]+:[[:space:]]*(pub[[:space:]]+)?static[[:space:]]' |
        jq -Rsc 'split("\n") | map(select(length > 0) | capture("^(?<path>[^:]+):(?<line>[0-9]+):")) |
                 map({id: "DIOXUS-GLOBALSIGNAL-USE", severity: "FAIL",
                      path, line: (.line | tonumber),
                      message: "GlobalSignal 出现在非 static 声明处（fn 体内 new / 局部引用）：全局单例只能从 static 读，逐个人审是否应降级为 use_signal（REFACTOR-RULES R11）"})'
      )"
      # 合成一个数组输出（两个空数组合并 = []，合法 JSON）
      printf '%s\n%s\n' "$a" "$b" | jq -cs 'add // []'
    - changed
optional: false
timeout: 60
