# CROSS-CRATE-IMPACT: 跨 crate 影响面门禁 (L2 语义层)
# 检测: PR/diff 跨 N 个以上 crate 改动 → 警告（建议拆分或说明耦合）
# 工具: 纯 git（code-review-graph 已退役，不再取 risk score）
# 性能: <1s
# SLA: l2 (语义层, 秒级)
# Hook: merge (重量, 跨 crate 影响需要人审视)
enabled: true
hooks: [merge]
sla: l2
fail_severity: WARN
match:
  paths_include: ["**/*.rs", "**/Cargo.toml"]
  paths_exclude: ["target/", ".wt/"]
mode: diff
harness:
  command: "sh"
  args:
    - "-c"
    - |
      ROOT=$(git rev-parse --show-toplevel)
      BASE=$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD~ 2>/dev/null)
      cd "$ROOT" || exit 2
      # 把 stderr 丢到 /tmp, stdout 纯 JSON
      exec 2>/tmp/gate-crg-impact-err.log
      changed=$(git diff --name-only "$BASE"...HEAD 2>/dev/null | awk -F/ '/^crates\// || /^bin\// {print $1"/"$2}' | sort -u)
      n_crates=$(echo "$changed" | wc -l | tr -d ' ')
      THRESHOLD=3
      if [ "$n_crates" -lt "$THRESHOLD" ]; then
        echo '[]'
      else
        echo "$changed" | jq -R -s '
          split("\n") | map(select(length > 0)) as $crates
          | [{
              id: "CROSS-CRATE-IMPACT",
              severity: "WARN",
              path: ".",
              line: 0,
              message: ("改动跨 " + ($crates | length | tostring) + " 个 crate (" + ($crates | join(", ")) + "), 阈值 " + ("'"$THRESHOLD"'") + " — 建议拆分或 PR 描述里说明耦合理由")
            }]' | jq -c .
      fi
optional: true
timeout: 60
