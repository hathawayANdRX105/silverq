# TODO / FIXME 必须挂 issue 号. 例: // TODO(#123): ... 或 todo!("TODO(#123): ...")
# 只扫注释与 todo!/unimplemented! 宏, 避开字符串字面量里的关键字表
# 扫仓库根, 不假设 crate 嵌套深度
enabled: true
hooks: [merge]
sla: l1
fail_severity: WARN
match:
  paths_include: ["**/*.rs"]
  paths_exclude: ["target/", ".wt/", "**/tests/**", "**/*_test.rs"]
mode: grep
harness:
  command: "sh"
  args:
    - "-c"
    - |
      ROOT=$(git rev-parse --show-toplevel)
      cd "$ROOT"
      # 扫描范围 = git 跟踪文件集 (gitignore 感知)
      matches=$(git ls-files -z -- '*.rs' | grep -zvE '(^|/)tests/' | xargs -0r grep -nEn '(//.*\b(TODO|FIXME)\b|(todo|unimplemented)!\()' 2>/dev/null | grep -vE '(TODO|FIXME)\(#[0-9]+' | grep -vE 'FORBIDDEN_KEYWORDS|stale_marker|GOOD_SUB_BODY|EAGER_TODO|MID_RUN_TODO' | head -20)
      if [ -z "$matches" ]; then
        echo '[]'
      else
        printf '%s' "$matches" | jq -R -s '
          split("\n") | map(select(length > 0))
          | map(capture("^(?<path>.+):(?<line>[0-9]+):(?<rest>.*)$"))
          | map({id:"TODO-NEEDS-ISSUE", severity:"WARN", path:.path, line:(.line|tonumber),
                 message:("TODO/FIXME 必须关联 issue 号 (例 // TODO(#123): 或 todo!(\"TODO(#123): ...\")): " + .rest)})'
      fi
optional: true
timeout: 10
