enabled: true
hooks:
- merge
sla: l1
fail_severity: FAIL
match:
  paths_include:
  - '**/*'
  paths_exclude:
  - target/
  - .wt/
mode: grep
harness:
  command: sh
  args:
  - -c
  - "set -e\nROOT=$(git rev-parse --show-toplevel)\ncd \"$ROOT\"\nREPO=\"${GATE_REPO:-}\"\nPR=\"${GATE_PR:-}\"\nif [ -z \"$REPO\" ]; then\n  REPO=$(gh repo view --json nameWithOwner -q .nameWithOwner 2>/dev/null || true)\nfi\nif [ -z \"$PR\" ]; then\n  # 兜底 1: 当前分支反查 PR (本地开发分支)\n  BR=$(git branch --show-current)\n  if [ -n \"$REPO\" ] && [ -n \"$BR\" ]; then\n    PR=$(gh pr view \"$BR\" --json number -q .number --repo \"$REPO\" 2>/dev/null || true)\n  fi\nfi\nif [ -z \"$PR\" ]; then\n  # 兜底 2: 按 HEAD SHA 反查 PR (合并后分支已删 / detached HEAD 场景)\n  HEAD_SHA=$(git rev-parse HEAD)\n  if [ -n \"$REPO\" ] && [ -n \"$HEAD_SHA\" ]; then\n    PR=$(gh api \"repos/$REPO/pulls\" -q \".[] | select(.head.sha == \"$HEAD_SHA\") | .number\" 2>/dev/null | head -1 || true)\n  fi\nfi\nif [ -z \"$REPO\" ] || [ -z \"$PR\" ]; then\n  echo '[{\"id\":\"PR-LABEL\",\"severity\":\"FAIL\",\"path\":\".\",\"line\":0,\"message\":\"无法定位当前 PR (gh 不可用或未配置 GATE_REPO/GATE_PR), label 检查跳过 — 合并前请人工核对 label\"}]'\n  exit 0\nfi\nLABELS=$(timeout 30 gh api \"repos/$REPO/pulls/$PR\" -q '[.labels[].name] | join(\",\")' 2>/dev/null || true)\nTITLE=$(timeout 30 gh api \"repos/$REPO/pulls/$PR\" -q .title 2>/dev/null || true)\nif [ -z \"$LABELS\" ] && [ -z \"$TITLE\" ]; then\n  echo '[{\"id\":\"PR-LABEL\",\"severity\":\"FAIL\",\"path\":\".\",\"line\":0,\"message\":\"gh 取 PR #'\"$PR\"' label 失败 (网络/token 问题), label 检查跳过 — 合并前请人工核对\"}]'\n  exit 0\nfi\nFINDINGS='[]'\n# 1) type label 至少 1 个 (gate type set 与 github_pull_requests.yaml type_labels_cfg 一致)\nif [ -z \"$LABELS\" ]; then\n  FINDINGS='[{\"id\":\"PR-LABEL-MISSING\",\"severity\":\"FAIL\",\"path\":\".\",\"line\":0,\"message\":\"PR #'\"$PR\"' 未挂任何 label — 必须至少挂 1 个 type label (bug/feature/chore/refactor/tests/documentation/epic)\"}]'\nelse\n  HAS_TYPE=$(printf '%s' \"$LABELS\" | tr ',' '\\n' | grep -cE '^(bug|feature|chore|refactor|tests|documentation|epic)$' || true)\n  if [ \"$HAS_TYPE\" -eq 0 ]; then\n    FINDINGS='[{\"id\":\"PR-LABEL-MISSING\",\"severity\":\"FAIL\",\"path\":\".\",\"line\":0,\"message\":\"PR #'\"$PR\"' 缺少 type label (当前: '\"$LABELS\"') — 必须至少挂 1 个 bug/feature/chore/refactor/tests/documentation/epic\"}]'\n  fi\nfi\n# 2) 域 label 推导: 标题命中域关键词但 1..n 个域 label 全缺 → WARN\n# 域映射: 关键词 → 候选域 label (任一命中即视为有, 否则 WARN 建议)\ndom_findings() {\n  local key=$1; shift\n  local doms=$1; shift\n  local hits=\"\"\n  case \" $TITLE \" in\n    *\"$key\"*) ;;\n    *) return 0 ;;\n  esac\n  for d in $(printf '%s' \"$doms\" | tr ',' ' '); do\n    if printf '%s' \"$LABELS\" | tr ',' '\\n' | grep -qx \"$d\"; then\n      hits=1; break\n    fi\n  done\n  if [ -z \"$hits\" ]; then\n    echo \"WARN|PR #$PR 标题含 $key 但缺域 label (建议: $doms)\"\n  fi\n  return 0\n}\nD1=$(dom_findings \"proxy\" \"gateway\") || true\nD2=$(dom_findings \"channel\" \"catalog, gateway\") || true\nD3=$(dom_findings \"catalog\" \"catalog, gateway\") || true\nD4=$(dom_findings \"admin\" \"admin-ui, admin-api\") || true\nD5=$(dom_findings \"tavern\" \"tavern-ui, tavern-api\") || true\nD6=$(dom_findings \"gateway\" \"gateway\") || true\nDLIST=$(printf '%s\\n%s\\n%s\\n%s\\n%s\\n%s\\n' \"$D1\" \"$D2\" \"$D3\" \"$D4\" \"$D5\" \"$D6\" | grep '^WARN|' || true)\nif [ -n \"$DLIST\" ]; then\n  EXTRA=$(printf '%s\\n' \"$DLIST\" | sed 's/^WARN|//' | jq -R -s 'split(\"\\n\") | map(select(length > 0)) | map({id:\"PR-LABEL-DOMAIN\", severity:\"FAIL\", path:\".\", line:0, message: .})')\n  FINDINGS=$(printf '%s' \"$FINDINGS\" | jq -c -s --argjson extra \"$EXTRA\" '.[0] + $extra')\nfi\nprintf '%s\\n' \"$FINDINGS\" | jq -c .\nexit 0\n"
