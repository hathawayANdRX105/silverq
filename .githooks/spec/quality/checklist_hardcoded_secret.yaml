# [jev-verified] 候选=PCRE(高召回), 判决=jev noul 'real credential?' — 占位符/测试夹具假阳性被滤掉
# CK-HARDCODED-SECRET: 硬编码密钥/密码/Token 检测
# 检测目标: 硬编码的密码、API key、token、连接字符串、私钥
# 为什么 grep 而非 LLM: 模式固定, 零 token, 毫秒级
# 需要: grep -P (PCRE) 支持 \x22 hex 转义
enabled: true
hooks: [pre-commit, pre-push, merge]
sla: l2
fail_severity: WARN
match:
  paths_include:
    - "**/*.rs"
    - "**/*.ts"
    - "**/*.js"
    - "**/*.py"
    - "**/*.go"
  paths_exclude:
    - "target/"
    - ".wt/"
    - "node_modules/"
    - "**/tests/**"
    - "**/test_*.rs"
    - "*.md"
mode: file
harness:
  command: "python3"
  args:
    - ".githooks/spec/harness/verify_chain.py"
    - "--rule"
    - "hardcoded_secret"
  # 候选 = 确定性正则（高召回）; 判决 = jev 语义验证（verify_chain.py）
  # 无 key / 请求失败 -> 候选降级为 WARN 原样输出（召回不丢，处置照常）
optional:
 true
timeout: 15
