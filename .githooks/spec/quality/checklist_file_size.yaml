# 泛用: 单文件体积上限（架构门禁，拆分触发器）
# 为什么: 1500 行 / 35KB 级别的巨型文件无法 review / 无法可靠测试。超阈值即提示按职责拆分。
# 阈值: 由 CLI 参数传入（默认 1500 行 / 35840 字节），不再写死在 shell heredoc。
# 棘轮: 存量超标记进 debt.tsv(进仓)，门禁只判升降，治「每个 merge 重复刷存量 WARN」的告警疲劳。
#       持平/下降 = 静默容忍；上升或新增超标 = WARN；账本缺失 = 照常报并提示先跑 seed。
# 记账: 首次 `python3 .githooks/spec/harness/file_size_gate.py seed --root .`
#       生成 debt.tsv(3 列 key\t行数\thash, 进仓)。judge 不建账本，只让存量只降不升。
# 检测: 自扫全仓 git ls-files '*.rs'(grep 模式, 零 LLM, worktree 安全), 数行数 + 字节
# 截断: 最多报 50 条，超出补一条 INFO "... and N more (truncated)"，不再 `| head -30` 静默截断。
enabled: true
hooks: [merge]
sla: l1
fail_severity: WARN
match:
  paths_include: ["**/*.rs"]
  paths_exclude: ["target/", ".wt/"]
mode: grep
harness:
  command: "python3"
  args:
    - ".githooks/spec/harness/file_size_gate.py"
    - "judge"
    - "--root"
    - "."
    - "--max-lines"
    - "1500"
    - "--max-bytes"
    - "35840"
    - "--max-report"
    - "50"
optional: true
timeout: 30