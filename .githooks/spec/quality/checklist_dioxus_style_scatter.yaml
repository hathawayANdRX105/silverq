# CK-DIOXUS-STYLE-SCATTER: tailwind 类名散落 / 硬编码颜色（ui-component-principles §4.1）
#
# 为什么: 样式散在 rsx 里，换主题要逐处改；原始色板类（bg-zinc-800、text-white）
#   绕开语义 token，主题色板一换就散架。「组件内出现未走 token 的硬编码色值视为违规」
#   是 ui-component-principles §4.1 的硬性条款。
# 判据（dioxus_web.py --only style 的三类 finding，全部 WARN）:
#   DIOXUS-INLINE-CLASS    内联 class 串 ≥ --class-limit 字符 → 抽成常量或用共享语义常量
#   DIOXUS-HARDCODED-COLOR 类串/样式串里 #hex 硬编码颜色
#   DIOXUS-RAW-PALETTE     原始色板类（bg-zinc-800 / text-white / text-red-400 …）
# 重要取舍: 不要求「所有 class 都得是常量」——单个原子类（flex / gap-2）提常量是
#   过度抽象，比散落更难维护（ui-kit styles.rs 明文约定）。只在成组出现时抽。
#   透明/current 不是色板值，不判。
# 口径: --scope changed = 「新代码不许新增散落」；存量债走 merge 全仓审计
#   （--scope repo 统计量级）+ 书面驳回，不在热路径里追。
# 工具: dioxus_web.py（l1 确定性，零 LLM，~1s）
enabled: true
hooks: [pre-push, merge]
sla: l1
fail_severity: WARN
match:
  paths_include: ["**/*.rs"]
  paths_exclude: ["target/", ".wt/", "node_modules/"]
mode: grep
harness:
  command: "python3"
  args:
    - ".githooks/spec/harness/dioxus_web.py"
    - "--only"
    - "style"
    - "--scope"
    - "changed"
    - "--class-limit"
    - "72"
optional: false
timeout: 60
