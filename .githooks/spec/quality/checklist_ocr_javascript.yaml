# ocr-review 替代品（JS/TS）
# 忠实移植 alibaba/open-code-review 的 internal/config/rules/rule_docs/ts_js_tsx_jsx.md：
# 6 类缺陷（typos/dead/quality/react/async/security）+ 总分（score）。
# React 规则仅在变更实际是 React 组件/用 hooks 时判定（criteria 已注明）。
enabled: true
hooks: [merge]
sla: l2
fail_severity: WARN
mode: file
match:
  paths_include: ["**/*.ts", "**/*.js", "**/*.tsx", "**/*.jsx", "**/*.mjs", "**/*.cjs"]
  paths_exclude: ["node_modules/", "target/", ".wt/", "dist/", "build/", "**/*.test.*", "**/*.spec.*"]
harness:
  command: "python3"
  args:
    - ".githooks/spec/harness/jev_rule.py"
    - "--config"
    - ".githooks/spec/harness/ocr-javascript.json"
optional: true
timeout: 300
