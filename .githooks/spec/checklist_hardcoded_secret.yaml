# CK-HARDCODED-SECRET: 硬编码密钥/密码/Token 检测
# 检测目标: 硬编码的密码、API key、token、连接字符串、私钥
# 为什么 grep 而非 LLM: 模式固定, 零 token, 毫秒级
# 需要: grep -P (PCRE) 支持 \x22 hex 转义
enabled: true
hooks: [pre-commit, pre-push, merge]
sla: l1
fail_severity: WARN
match:
  paths_include:
    - "**/*.rs"
    - "**/*.ts"
    - "**/*.js"
    - "**/*.py"
    - "**/*.go"
  paths_exclude:
    - "target/"
    - ".wt/"
    - "node_modules/"
    - "**/tests/**"
    - "**/test_*.rs"
    - "*.md"
mode: grep
harness:
  command: "sh"
  args:
    - "-c"
    - |
      ROOT=$(git rev-parse --show-toplevel)
      # PCRE: 键名 + = + "或' + 8+字符 + 闭合引号
      pat='(password|passwd|secret|api_key|apikey|token|auth_token|access_token|private_key|connection_string)\s*[:=]\s*[\x22\x27][^\x22\x27\s]{8,}[\x22\x27]'
      # 排除占位符
      exclude_pat='(your-|xxx|todo|placeholder|example|test-key|mock|fake|dummy|change-me|replace-me|insert-|changeme|replaceme)'
      matches=$(grep -iPrn "$pat" "$ROOT" \
        --include='*.rs' --include='*.ts' --include='*.js' \
        --include='*.py' --include='*.go' \
        --exclude='*_test.go' --exclude='*_test.py' --exclude='test_*.py' \
        --exclude='*.test.ts' --exclude='*.test.js' --exclude='*.spec.ts' --exclude='*.spec.js' \
        --exclude-dir=target --exclude-dir=.wt --exclude-dir=node_modules \
        --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
        --exclude-dir=vendor --exclude-dir=tests 2>/dev/null \
        | grep -viE "$exclude_pat" \
        | head -30)
      if [ -z "$matches" ]; then
        echo '[]'
      else
        printf '%s' "$matches" | jq -R -s '
          split("\n") | map(select(length > 0))
          | map(capture("^(?<path>.+):(?<line>[0-9]+):(?<rest>.*)$"))
          | map({
              id: "HARDCODED-SECRET",
              severity: "WARN",
              path: .path,
              line: (.line | tonumber),
              message: ("硬编码密钥/密码/Token: " + .rest)
            })'
      fi
optional: true
timeout: 15
