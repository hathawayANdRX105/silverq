max_depth: 5
ignore_paths:
  - ".wt/"
  - "node_modules/"
  - "target/"
  - "__pycache__/"
  - ".git/"
  - ".benchmarks/"
  - ".pytest_cache/"
  - ".venv/"
  - ".ruff_cache/"
  - ".mypy_cache/"
  - ".agent/"
  - "todo/"
orphan_patterns:
  - "tmp/"
  - "__pycache__/"

# 检查能力选择 / 严重度 (缺省 = 全部启用, WARN)
