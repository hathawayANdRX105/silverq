[package]
name = "lift"
version = "0.1.0"
edition = "2021"
description = "Stability-first proxy node scheduler (EWMA + batch concurrent testing + fast/slow path separation)"
license = "MIT"
authors = ["hathaway"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio-util = { version = "0.7", features = ["time"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = { version = "0.3", features = ["std"] }
async-trait = "0.1"

[dependencies.meow-proxy]
version = "0.21"
optional = true

[features]
default = []
meow = ["meow-proxy"]

[dev-dependencies]
tokio-test = "0.4"
