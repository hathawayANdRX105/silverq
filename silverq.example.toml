# silverq 配置示例。
# 复制为 silverq.toml 放在启动目录，或用 `silverq serve nodes.yaml --config path` 指定。
# 文件不存在时全部用内置默认值，零配置可跑。
# 环境变量（SILVERQ_*）优先级高于本文件。

[scheduler]
# 主组容量：EWMA 排名前 N 进 selection
capacity = 10
# 每批测速节点数。
# concurrency 必须 ≥ 这个值，否则批内排队：并发上限作用在批内
# （buffer_unordered），真实并行度 = min(batch_size, concurrency)。
batch_size = 20
# 测速轮间隔（秒）。实际周期 = max(一轮耗时, interval_secs)。
# 217 节点 / batch 20 → 11 批 ≈ 27s 一轮，所以 90 真正生效。
# 早先 batch 5 时一轮要 110s > interval 45s，间隔被淹没，等于满负荷连轴转。
interval_secs = 90
# 单节点测速超时（毫秒）
timeout_ms = 2500
# 批内最大并发。必须 ≥ batch_size，见上。
# 测速全是等 IO，不烧 CPU，提高并发几乎无代价。
concurrency = 20
# 超时扣分幅度（毫秒）
timeout_penalty = 3000.0
# 探测 URL（generate_204 风格）
probe_url = "https://www.gstatic.com/generate_204"

[data_plane]
# 监听地址（SOCKS5 / HTTP-CONNECT 混合）
listen = "127.0.0.1:17321"
# Web 面板（无认证，只绑回环）。9090 是 clash_api 惯例端口，故默认 9095 避冲突
web_listen = "127.0.0.1:9095"
# fallback 尝试上限：按 EWMA 顺序最多试几个候选。
# 3 = 队首 + 两个次优；1 = 只用队首不 fallback。
# 池子普遍半死时可调大，但每个死候选都要烧一个 dial 超时（timeout_ms × 2），
# 单请求最坏延迟随之上升。
fallback_attempts = 3

[paths]
# EWMA 分数存档（重启恢复；超过 6 小时视为过期丢弃）
state = "~/.local/state/silverq/scores.json"
# ctl socket（silverq reload / select / status）
ctl_sock = "~/.local/state/silverq/ctl.sock"
# 外部 meow kernel 读的 selector store
selector_store = "~/.local/state/silverq-selector.json"
