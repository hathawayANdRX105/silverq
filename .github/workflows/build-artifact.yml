name: Build artifact

# 手动触发：构建 meow-tun 二进制 → 冒烟 → 上传 workflow artifact，仅供本地部署取用。
# 与 release.yml 的区别：不打 tag、不发 GitHub Release。
# 触发方式：gh workflow run build-artifact.yml --ref <branch>
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "构建的分支/ref（默认触发时所在分支）"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build meow-tun (no UPX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: meow-tun

      - name: 构建 meow-tun（release，性能最优 profile）
        # profile.release 已含 lto=fat / codegen-units=1 / opt-level=3 / strip。
        # 不做 UPX：UPX --best --lzma 压过的二进制在本机 serve 启动约 10s 后
        # 静默退出（无 panic），而同一 commit 未压缩的本地构建稳定运行；
        # 长跑吞吐型 daemon 不值得为 10MB 体积冒这个险。
        run: cargo build --release --features meow-tun

      - name: 冒烟（--version / --help 正常）
        run: |
          ./target/release/silverq --version
          ./target/release/silverq --help >/dev/null

      - name: 打包 tarball + sha256
        run: |
          cd target/release
          tar czf silverq-meow-tun-x86_64-linux.tar.gz silverq
          sha256sum silverq-meow-tun-x86_64-linux.tar.gz > silverq-meow-tun-x86_64-linux.tar.gz.sha256
          mv silverq-meow-tun-x86_64-linux.tar.gz* "$GITHUB_WORKSPACE/"

      - name: 上传 workflow artifact（不发 Release）
        uses: actions/upload-artifact@v4
        with:
          name: silverq-meow-tun-x86_64-linux
          path: |
            silverq-meow-tun-x86_64-linux.tar.gz
            silverq-meow-tun-x86_64-linux.tar.gz.sha256
          retention-days: 7
