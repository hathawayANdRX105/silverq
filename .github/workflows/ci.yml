name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：全部 job 只需读 checkout（构建/测试不写仓库，评论由本地 gate 工具发）
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 失败时打印完整 backtrace，e2e 排障要靠它
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all --check

  # 两种 feature 组合都要过：meow 关掉时 NoopMeasurer 路径独立编译，
  # 只测一种会漏掉 cfg 分支里的错误（这个项目已经踩过一次）。
  clippy:
    name: Clippy (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 三种 feature 组合都要过：meow 关掉时 NoopMeasurer 路径独立编译，
        # meow-tun 多编译一整块 TUN 数据面，只测两种会漏掉 cfg 分支里的错误
        include:
          - mode: default
            features: ""
          - mode: meow
            features: "--features meow"
          - mode: meow-tun
            features: "--features meow-tun"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.mode }}
      - name: Run clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  test:
    name: Test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            features: ""
          - mode: meow
            features: "--features meow"
          - mode: meow-tun
            features: "--features meow-tun"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.mode }}
      - name: Build all targets
        run: cargo build --all-targets ${{ matrix.features }}
      # 单测 + 集成测试（tests/ 按源文件划分）。meow 模式额外覆盖数据面单测与
      # e2e：真起 silverq serve 进程，真 SOCKS5 / HTTP-CONNECT 客户端打流量，
      # 全程走 127.0.0.1（本地 echo + 本地探测端点），不依赖外网，CI 可稳定跑。
      - name: Test all
        run: cargo test ${{ matrix.features }}
      # e2e 只在 meow 模式有意义：数据面在该 feature 下。
      - name: e2e data plane
        if: matrix.mode == 'meow' || matrix.mode == 'meow-tun'
        run: cargo test --features meow --test e2e_data_plane

  # TUN 实现已完成（启用 meow-tun feature 时）。
  # 这个 job 保证在没有 meow-tun feature 时，TUN 代码不会被调用。
  tun-placeholder:
    name: TUN placeholder not wired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert tun::run is not called without meow-tun feature
        run: |
          # TUN 已实现：合法调用点只有 src/dataplane/tun.rs 自身（实现）
          # 与 main.rs 里被 #[cfg(all(feature="meow", feature="meow-listener"))]
          # 保护的 wiring（tun::run(tun_config ...）。模块整体 #![cfg] 门控，
          # 非 meow-tun 构建里误接会是编译错误，这里只是更早拦住并把话说清楚。
          if grep -rn --include=*.rs "tun::run\|tun::setup_route_protection" src/ tests/ \
             | grep -v "^src/dataplane/tun.rs:" \
             | grep -v "tun::run(tun_config"; then
            echo "::error::发现未被 meow-tun cfg 保护的 tun::run 调用"
            exit 1
          fi
          echo "ok: TUN 占位未被错误接线"
