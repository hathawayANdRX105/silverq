name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：全部 job 只需读 checkout（构建/测试不写仓库，评论由本地 gate 工具发）
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 失败时打印完整 backtrace，e2e 排障要靠它
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all --check

  # 两种 feature 组合都要过：meow 关掉时 NoopMeasurer 路径独立编译，
  # 只测一种会漏掉 cfg 分支里的错误（这个项目已经踩过一次）。
  clippy:
    name: Clippy (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            features: ""
          - mode: meow
            features: "--features meow"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.mode }}
      - name: Run clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  test:
    name: Test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            features: ""
          - mode: meow
            features: "--features meow"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.mode }}
      - name: Build all targets
        run: cargo build --all-targets ${{ matrix.features }}
      # 单测 + 集成测试（tests/ 按源文件划分）。meow 模式额外覆盖数据面单测与
      # e2e：真起 silverq serve 进程，真 SOCKS5 / HTTP-CONNECT 客户端打流量，
      # 全程走 127.0.0.1（本地 echo + 本地探测端点），不依赖外网，CI 可稳定跑。
      - name: Test all
        run: cargo test ${{ matrix.features }}

  # TUN 是显式未实现的占位（src/dataplane/tun.rs 里是 unimplemented!/todo!）。
  # 这个 job 保证占位没被误接线到运行路径上：一旦有人真调用它，
  # 应该是编译期就被这里拦住，而不是线上 panic 或静默假装 TUN 在跑。
  tun-placeholder:
    name: TUN placeholder not wired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert tun::run is never called
        run: |
          if grep -rn --include=*.rs "tun::run\|tun::setup_route_protection" src/ tests/ \
             | grep -v "^src/dataplane/tun.rs:"; then
            echo "::error::src/dataplane/tun.rs 是未实现占位，不应被调用（见该文件模块文档）"
            exit 1
          fi
          echo "ok: TUN 占位未接线"
