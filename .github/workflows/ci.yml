name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 失败时打印完整 backtrace，e2e 排障要靠它
  RUST_BACKTRACE: 1

jobs:
  # fmt 单独一个 job：不用编译依赖，几秒出结果，PR 上最快反馈
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 三种 feature 组合都要过：meow 关掉时 NoopMeasurer 路径独立编译，
        # meow-tun 多编译一整块 TUN 数据面，只测两种会漏掉 cfg 分支里的错误
        include:
          - mode: default
            features: ""
          - mode: meow
            features: "--features meow"
          - mode: meow-tun
            features: "--features meow-tun"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.mode }}
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  test:
    name: test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            features: ""
          - mode: meow
            features: "--features meow"
          - mode: meow-tun
            features: "--features meow-tun"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.mode }}

      - name: build
        run: cargo build --all-targets ${{ matrix.features }}

      # 单测：协议解析、UDP 头编解码、EWMA、配置校验。
      # 用 --bins 而非 --lib：本 crate 只有 bin target，--lib 会报
      # "no library targets found" 让 CI 无意义地失败。
      - name: unit tests
        run: cargo test --bins ${{ matrix.features }}

      # e2e：真起 silverq serve 进程，用真 SOCKS5 / HTTP-CONNECT 客户端打流量，
      # 覆盖 TCP CONNECT、UDP ASSOCIATE、分片丢弃、BIND 拒绝、隧道无残留。
      # 全程走 127.0.0.1（本地 echo + 本地探测端点），不依赖外网，CI 可稳定跑。
      # 只在 meow 模式有意义：数据面在该 feature 下。
      - name: e2e data plane
        if: matrix.mode == 'meow' || matrix.mode == 'meow-tun'
        run: cargo test --features meow --test e2e_data_plane

  # TUN 实现已完成（启用 meow-tun feature 时）。
  # 这个 job 保证在没有 meow-tun feature 时，TUN 代码不会被调用。
  tun-placeholder:
    name: TUN placeholder not wired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert tun::run is not called without meow-tun feature
        run: |
          # 检查在没有 meow-tun feature 时，是否有代码调用了 tun::run
          # 如果开启了 meow-tun，则允许调用
          # 这里检查是否有未被 cfg(all(feature = "meow", feature = "meow-listener")) 保护的调用
          # 使用简单的行数检查：找到 tun::run 调用，检查前几行是否有 cfg guard
          violations=0
          while IFS= read -r line; do
            file="${line%%:*}"
            lineno="${line#*:}"
            lineno="${lineno%%:*}"
            # 检查前 5 行是否有 cfg guard
            has_guard=false
            for i in $(seq 1 5); do
              check_line=$((lineno - i))
              if [ $check_line -lt 1 ]; then break; fi
              prev_line=$(sed -n "${check_line}p" "$file")
              if echo "$prev_line" | grep -q 'cfg(all(feature = "meow", feature = "meow-listener"))'; then
                has_guard=true
                break
              fi
            done
            if [ "$has_guard" = false ]; then
              echo "::error file=$file,line=$lineno::Found unguarded tun::run call"
              violations=1
            fi
          done < <(grep -rn --include=*.rs "tun::run\|tun::setup_route_protection" src/ tests/ \
            | grep -v "^src/tun.rs:" \
            | grep -v "crate::tun::run" \
            | grep -v "crate::tun::TunConfig")
          
          if [ $violations -eq 1 ]; then
            exit 1
          fi
          echo "ok: TUN 占位未被错误接线"
